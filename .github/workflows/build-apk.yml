name: Build APK Kopi Jojo POS

# Jalan otomatis setiap ada perubahan di branch main, atau manual lewat tab Actions > Run workflow.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Cek kunci tanda tangan (GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum diisi:$missing. Buka Settings > Secrets and variables > Actions > New repository secret (lihat PANDUAN-APK.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Siapkan Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install paket
        run: npm ci

      - name: Buat proyek Android
        run: bash scripts/prepare-android.sh

      - name: Build APK release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Siapkan file APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kopi-jojo-pos.apk
          ls -la kopi-jojo-pos.apk

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopi-jojo-pos-${{ env.VERSION_NAME }}
          path: kopi-jojo-pos.apk

      - name: Terbitkan GitHub Release (sumber update OTA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          NOTES="$(git log -1 --pretty=%B | head -c 800)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" kopi-jojo-pos.apk --clobber
          else
            gh release create "$TAG" kopi-jojo-pos.apk --title "Kopi Jojo POS ${VERSION_NAME}" --notes "$NOTES" --latest
          fi
          echo "### APK siap" >> "$GITHUB_STEP_SUMMARY"
          echo "Link unduh tetap: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/kopi-jojo-pos.apk" >> "$GITHUB_STEP_SUMMARY"
