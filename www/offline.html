<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kopi Jojo POS - Tidak ada koneksi</title>
<style>
  html,body{margin:0;height:100%;background:#1E1714;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;}
  .card{background:#fff;border-radius:18px;padding:28px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);}
  .logo{width:64px;height:64px;border-radius:16px;background:#6F4E37;color:#fff;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  h1{font-size:19px;margin:0 0 8px;color:#1E1714;}
  p{font-size:14px;color:#555;line-height:1.5;margin:0 0 18px;}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:#6F4E37;color:#fff;font-size:15px;font-weight:700;}
  small{display:block;margin-top:12px;color:#999;font-size:12px;}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="logo">K</div>
  <h1>Tidak ada koneksi internet</h1>
  <p>Kopi Jojo POS perlu internet saat pertama kali dibuka. Setelah terbuka, kasir tetap bisa mencatat transaksi walau sinyal putus.</p>
  <button id="retry">Coba Lagi</button>
  <small id="st">Mencoba otomatis setiap 10 detik&hellip;</small>
</div></div>
<script>
  var APP_URL = 'https://kasir.kopijojo.com/';
  function go(){ location.replace(APP_URL); }
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
  setInterval(function(){ if(navigator.onLine) go(); }, 10000);
</script>
</body>
</html>
